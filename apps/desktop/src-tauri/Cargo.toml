[package]
name = "labore-portal"
version = "0.1.0"
description = "Aplicativo desktop do Labore Portal"
authors = ["Labore Portal"]
edition = "2021"

[lib]
name = "labore_portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
