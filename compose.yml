services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - local-infra
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labore}
      POSTGRES_USER: ${POSTGRES_USER:-labore_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local environment file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - labore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labore_app} -d ${POSTGRES_DB:-labore}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  labore_postgres_data:
