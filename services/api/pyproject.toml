[project]
name = "labore-portal-api"
version = "0.1.0"
description = "Fundacao da API do Labore Portal"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.19,<2",
	"argon2-cffi>=25.1,<26",
	"fastapi>=0.141,<1",
	"httpx>=0.28,<1",
	"psycopg[binary]>=3.3,<4",
	"pydantic-settings>=2.15,<3",
	"python-multipart>=0.0.32,<1",
	"sqlalchemy>=2.0,<3",
	"uvicorn[standard]>=0.52,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
strict = true
